<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GenLayer Prediction Market</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: system-ui, -apple-system, sans-serif; background: #0a0a0a; color: #e5e5e5; padding: 2rem; }
      h1 { color: #7c3aed; margin-bottom: 1rem; }
      h2 { color: #a78bfa; margin: 1.5rem 0 0.5rem; }
      button { background: #7c3aed; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
      button:hover { background: #6d28d9; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      input, select { background: #1a1a1a; border: 1px solid #333; color: #e5e5e5; padding: 0.5rem; border-radius: 6px; width: 100%; margin-bottom: 0.5rem; }
      .card { background: #141414; border: 1px solid #222; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
      .status { padding: 0.5rem 1rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.85rem; }
      .connected { background: #052e16; border: 1px solid #166534; }
      .disconnected { background: #1c1917; border: 1px solid #44403c; }
      .error { background: #2d0a0a; border: 1px solid #7f1d1d; color: #fca5a5; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
      @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
